project:
  type: website
  output-dir: ../docs/

# Note: freeze functionality can be set at a project level or for individual .qmd files
# execute:
#   freeze: false

website:
  title: "$ALTDOC_PACKAGE_NAME"
  code-links: true
  navbar:
    search: true
    left:
      - text: Home
        href: index.html
      - text: Explore
        href: vignettes/explore.html
      - text: Blog
        href: vignettes/blog.html
      - text: Reference
        href: vignettes/reference.html
    right:
      - text: News
        href: $ALTDOC_NEWS
      - text: License
        href: $ALTDOC_LICENSE
      - text: Citation
        href: $ALTDOC_CITATION
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub

format:
  html:
    code-link: true
    code-tools: true
    theme: [cosmo, custom.scss]
    toc: true
    code-fold: true
    # Widen the body column (default 800px) to reduce empty gutter space while
    # keeping the right-hand TOC margin.
    grid:
      body-width: 1150px
      margin-width: 250px
      sidebar-width: 250px

execute:
  freeze: auto
  warning: false
  message: false
