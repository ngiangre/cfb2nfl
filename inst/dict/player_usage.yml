dataset: player_usage
source: derived in-pipeline (build_player_usage(player_game, roster, games))
grain: one player-season-team (a player on a team in a season, roster or stat line)
key: playerId + season + team
description: >
  Playing time per player-season-team. games_appeared counts the team's games in
  which the player has at least one stat line in game_player_stats; team_games is
  the team's games played that season (completed games with scores, all
  divisions, postseason included); appearance_rate is games_appeared /
  team_games. The reg_ columns repeat the counts for regular-season games only.
  Caveat: no stat line does not mean the player did not play. Offensive linemen
  and many special-teamers log no stat line even when they play, so their
  appearance rate is a floor. Per-game columns (pass_att_pg, rush_car_pg, rec_pg,
  tackles_pg) are the player's total over games appeared divided by
  games_appeared; NA when the player appeared in no game. The universe is the
  roster's player-seasons unioned with stat-line player-seasons (about 1.7k
  stat-line player-seasons are off the roster), so no player with a stat line is
  dropped. Position and class year come from the roster for that team-season;
  on_roster is FALSE for a stat-line-only player-season, with position and class
  year NA. Class year is recorded only from about 2019 on. A derived table:
  materialized into the DuckDB bundle, not published as parquet. Contract:
  contract_player_usage() (key uniqueness, games_appeared <= team_games, no row
  loss against player_game, team_games tied out to team_record()).
  player_appearance_sequence() exposes the per-game appeared flags behind
  games_appeared.
columns:
  - name: playerId
    type: string
    description: CFBD athlete id, the shared college athlete namespace.
    provenance: derived (roster.playerId, game_player_stats.playerId)
  - name: season
    type: int32
    description: Season year.
    provenance: derived (roster.season, player_game.season)
  - name: team
    type: string
    description: The school the player was on that season (a transfer has one row per team, display only).
    provenance: derived (roster.team, player_game.team)
  - name: position_group
    type: string
    description: Harmonized position group from the roster position for that team-season. NA when on_roster is FALSE.
    provenance: derived (roster.position via harmonize_position())
  - name: class_year
    type: int32
    description: Eligibility class (1-5) from the roster for that team-season. NA where CFBD does not record it (mostly before 2019) or on_roster is FALSE.
    provenance: derived (roster.class_year)
  - name: on_roster
    type: logical
    description: TRUE when the player-season is on the CFBD roster; FALSE when it appears only in the game stats.
    provenance: derived (roster, game_player_stats)
  - name: team_games
    type: int32
    description: The team's games played in the season (completed, scored, all divisions, postseason included). Denominator for appearance_rate. 0 when the team has no completed game.
    provenance: derived (team_game_schedule(games))
  - name: games_appeared
    type: int32
    description: Team games in which the player has at least one stat line. Not the same as games played (see the description).
    provenance: derived (player_game rows per player-season-team)
  - name: appearance_rate
    type: double
    description: games_appeared / team_games; NA when team_games is 0.
    provenance: derived (games_appeared / team_games)
  - name: reg_team_games
    type: int32
    description: The team's regular-season games played in the season (completed, scored).
    provenance: derived (team_game_schedule(games), seasonType regular)
  - name: reg_games_appeared
    type: int32
    description: Regular-season team games in which the player has a stat line.
    provenance: derived (player_game rows, seasonType regular)
  - name: reg_appearance_rate
    type: double
    description: reg_games_appeared / reg_team_games; NA when reg_team_games is 0.
    provenance: derived (reg_games_appeared / reg_team_games)
  - name: pass_att_pg
    type: double
    description: Passing attempts per game appeared (total over appeared games / games_appeared). NA when games_appeared is 0. Zero for a player with no passing line in any appeared game.
    provenance: derived (player_game.pass_att)
  - name: rush_car_pg
    type: double
    description: Rushing attempts (carries) per game appeared. NA when games_appeared is 0.
    provenance: derived (player_game.rush_car)
  - name: rec_pg
    type: double
    description: Receptions per game appeared. NA when games_appeared is 0.
    provenance: derived (player_game.rec)
  - name: tackles_pg
    type: double
    description: Total tackles per game appeared. NA when games_appeared is 0.
    provenance: derived (player_game.tackles)
