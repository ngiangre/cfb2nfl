dataset: coaches
source: CFBD /coaches (seasons block unnested)
grain: one head-coach-season (head coaches only — no coordinators / S&C)
key: coach_id + season; joins to player-seasons on (school == team, season)
description: >
  Head coaches with per-season program performance (SRS, SP+ overall/offense/
  defense, wins). Coach *changes* between seasons are the v1 coaching features.
columns:
  - name: coach_id
    type: int32
    description: CFBD coach id.
    provenance: raw (id)
  - name: coach_name
    type: string
    description: firstName + lastName.
    provenance: derived (clean_coaches)
  - name: school
    type: string
    description: Program; join key to player-season team.
    provenance: raw (seasons_school)
  - name: conference
    type: string
    description: Program's conference that season.
    provenance: raw (seasons_conference)
  - name: season
    type: int32
    description: Season year.
    provenance: raw (seasons_year)
  - name: srs
    type: double
    description: Team-season Simple Rating System (points above/below average, where 0 is average; typically roughly -25 to +30).
    provenance: raw (seasons_srs)
  - name: sp_overall
    type: double
    description: Team-season SP+ overall rating (points per game vs average, typically roughly -25 to +30).
    provenance: raw (seasons_spOverall)
  - name: sp_offense
    type: double
    description: Team-season SP+ offense rating (same scale as sp_overall).
    provenance: raw (seasons_spOffense)
  - name: sp_defense
    type: double
    description: Team-season SP+ defense rating (same scale as sp_overall; sign convention follows the feed).
    provenance: raw (seasons_spDefense)
  - name: games
    type: int32
    description: Games coached that season.
    provenance: raw (seasons_games)
  - name: wins
    type: int32
    description: Regular-season wins.
    provenance: raw (seasons_wins)
  - name: losses
    type: int32
    description: Regular-season losses.
    provenance: raw (seasons_losses)
