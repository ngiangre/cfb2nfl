dataset: position_path
source: derived in-pipeline (build_position_path(roster, recruiting, player_season, picks_nfl, nfl_draft_picks))
grain: one college athlete id (non-reused), chaining HS -> college -> NFL position groups
key: playerId (string)
description: >
  Per-player position path: each athlete's harmonized position group at high
  school, across the college roster, and in the NFL. Positions are harmonized by
  harmonize_position() into eleven shared groups (Quarterback, Running back,
  Receiver, Tight end, Offensive line, Defensive line, Linebacker, Defensive
  back, Special teams, Athlete, Position not recorded), so EDGE/DE/DT all read
  "Defensive line" and IOL/OG/OT all read "Offensive line". HS is taken from the
  id-joined recruit only when a guard passes (recruit_link_method()): exact name
  agreement, a name variant plus a school + class year match, or, with no college
  name on file, the school + class year match alone. The NFL group is the
  nflverse draft position of the slot-linked pick. Ids with more than one CFBD
  pick, and reused ids, are not linked. A derived table: materialized into the
  DuckDB bundle, not published as parquet. Contract: contract_position_path()
  and contract_position_mapping().
columns:
  - name: playerId
    type: string
    description: Athlete id (the shared college-athlete namespace). Non-reused roster ids only.
    provenance: derived (roster.playerId)
  - name: hs_linked
    type: logical
    description: TRUE when the id-joined recruiting record passes a link guard (hs_link_method not NA). FALSE covers both unrecruited players and recruits rejected as different people.
    provenance: derived (recruit_link_method)
  - name: hs_link_method
    type: string
    description: >
      Which guard linked the recruit: "name" (names agree after normalization),
      "name_variant" (nickname / legal-name / typo variant at the committed
      school within 0-2 years of the class), or "school_year" (no college name
      on file; committed school is a first-two-seasons roster team and the first
      season is 0-2 years after the class). NA when not linked. The school + year
      guards carry an estimated 0.6% wrong-person rate.
    provenance: derived (recruit_link_method)
  - name: hs_class
    type: int32
    description: High-school recruiting class year, set only when `hs_linked`.
    provenance: derived (recruiting.hs_class)
  - name: hs_group
    type: string
    description: Harmonized high-school position group from the recruit's position code. NA unless `hs_linked`.
    provenance: derived (harmonize_position, source recruiting)
  - name: college_seasons
    type: int32
    description: Distinct roster seasons with a recorded (non-blank) position. Zero when the player's roster rows carry no position.
    provenance: derived (roster)
  - name: college_groups
    type: int32
    description: Distinct harmonized college position groups across recorded seasons. Zero when no recorded position.
    provenance: derived (roster, harmonize_position source roster)
  - name: college_first_group
    type: string
    description: Group on the earliest recorded roster season (ties alphabetical). NA if none.
    provenance: derived (roster)
  - name: college_last_group
    type: string
    description: Group on the latest recorded roster season (ties alphabetical). NA if none.
    provenance: derived (roster)
  - name: college_modal_group
    type: string
    description: Group recorded in the most seasons; ties go to the group seen most recently. NA if none.
    provenance: derived (roster)
  - name: college_changed
    type: logical
    description: "TRUE when the recorded college groups differ across seasons. Always FALSE in the current data: CFBD lists one static roster position per athlete."
    provenance: derived (college_groups > 1)
  - name: drafted
    type: logical
    description: TRUE when the athlete id is on a CFBD draft pick (any pick, including id-shared ones).
    provenance: derived (picks.playerId)
  - name: nfl_linked
    type: logical
    description: TRUE when the athlete has exactly one CFBD pick and its draft slot links to an nflverse record that passes the name guard (link_nfl_draft()).
    provenance: derived (link_nfl_draft nfl_matched)
  - name: nfl_group
    type: string
    description: Harmonized NFL position group from the nflverse draft position of the linked pick. NA unless `nfl_linked`. UDFAs have no NFL group.
    provenance: derived (nfl_draft_picks.position via gsis_id, harmonize_position source nfl_draft)
