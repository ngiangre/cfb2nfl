dataset: nfl_pbp
source: nflverse nflreadr::load_pbp (seasons 2022 to the current NFL season)
grain: one NFL play (regular season and postseason)
key: (game_id, play_id)
description: 'nflverse (nflfastR) play-by-play with every column nflverse ships, including
  EPA, WPA and success. Every *_player_id column is a GSIS id that joins outcomes.gsis_id,
  nfl_rosters.gsis_id and nfl_rosters_weekly.gsis_id. An outcome table: never an in-career
  model input (decision 0014). Coverage starts in 2022, so careers that began earlier
  are truncated: use season-grain nfl_rosters for whole careers and for longevity.
  The current season is partial until it ends.'
columns:
