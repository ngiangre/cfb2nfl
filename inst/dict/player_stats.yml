dataset: player_stats
source: CFBD /stats/player/season (per year, 2010–2026)
grain: LONG — one row per player-season-category-statType-stat
key: playerId (string) + season
description: >
  Player season statistics in long format. Pivot into position-relevant
  features at the features stage.
columns:
  - name: season
    type: int32
    description: Season year.
    provenance: raw
  - name: playerId
    type: string
    description: CFBD athlete id (string); canonical player key.
    provenance: raw
  - name: player
    type: string
    description: Player display name (display only, do not join on name).
    provenance: raw
  - name: position
    type: string
    description: Player position.
    provenance: raw
  - name: team
    type: string
    description: Team; joins to head-coach-season on (team == school, season).
    provenance: raw
  - name: conference
    type: string
    description: Conference; joins to the season-aware tier lookup.
    provenance: raw
  - name: category
    type: string
    description: Stat category (e.g. passing, rushing). Pivot dimension.
    provenance: raw
  - name: statType
    type: string
    description: Stat type within category. Pivot dimension.
    provenance: raw
  - name: stat
    type: string
    description: Stat value (string in the raw feed).
    provenance: raw
