dataset: stat_taxonomy
source: hand-authored package data (inst/extdata/stat_taxonomy.csv)
grain: one (category, statType) pair
key: (category, statType)
description: >
  Canonical mapping that makes the long player_stats interpretable: each
  (category, statType) pair gets a game phase (offense / defense /
  special_teams), a plain-language label, and a kind (scoring / volume / rate).
  Keyed at (category, statType) because a category alone can be phase-ambiguous
  (fumbles/FUM and fumbles/LOST are offense; fumbles/REC is defense). Read via
  stat_taxonomy(); coverage of every pair in player_stats is enforced by
  contract_stat_taxonomy(). Materialized into the DuckDB bundle, not published
  as a parquet asset.
columns:
  - name: category
    type: string
    description: Stat category as it appears in player_stats (e.g. passing).
    provenance: raw
  - name: statType
    type: string
    description: Stat type within the category as it appears in player_stats.
    provenance: raw
  - name: phase
    type: string
    description: Game phase — offense, defense, or special_teams.
    provenance: derived
  - name: label
    type: string
    description: Plain-language name for the stat (disambiguates bare statTypes).
    provenance: derived
  - name: kind
    type: string
    description: Stat kind — scoring, volume, or rate.
    provenance: derived
  - name: description
    type: string
    description: One-line human description of the stat.
    provenance: derived
