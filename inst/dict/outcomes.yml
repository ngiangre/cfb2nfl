dataset: outcomes
source: derived in-pipeline (build_outcomes(ps_pop, career, recruiting, picks_nfl, nfl_rosters, nfl_player_stats, nfl_draft_picks, roster, team_season))
grain: one roster or stat-line player-season (person-period)
key: (playerId, season)
description: >
  The modeling dependent variables, at the person-period grain: every season a
  player is on a college roster, plus any stat-line season without a roster row
  (reused CFBD ids excluded; `outcomes_backbone()`). `has_stat_line` marks the
  seasons with a stat line in `player_stats`, the population before decision
  0050. Season rows carry an eligibility clock anchored at
  high-school graduation; career-level labels (drafted, NFL entry, first-year
  NFL success) are resolved once per player and stamped on the relevant rows, so
  models query the dependent variable directly with no further derivation.
  NFL-side labels are OUTCOMES ONLY, never model inputs. The draft label joins
  the CFBD one-pick-per-player lookup; the UDFA label is a name-guarded
  single-candidate roster match (ambiguous names resolve to no link, never a
  guess). Rows whose draft year is after `last_complete_draft` carry NA outcomes
  and `status_end_of_season = "censored"` (administrative right-censoring), never
  a fabricated 0. Published as parquet on data-latest and bundled into the DuckDB
  asset. Contract: contract_outcomes() (population grain preserved, every row
  tiered, every in-window pick on a population id drafted on the row of its own
  draft year, event mutual exclusivity, censoring carries NAs, positive event
  times).
columns:
  - name: playerId
    type: string
    description: Athlete id (the shared college-athlete namespace).
    provenance: derived (player_stats.playerId)
  - name: player
    type: string
    description: >
      Player name, used for the name guards: the stat-line name, else the name
      on a draft pick with the same id. NA for a roster-only player who was
      never drafted (the cleaned roster carries no names), so those players get
      no recruiting or undrafted-signing match.
    provenance: derived (player_stats.player, else picks.name)
  - name: season
    type: int32
    description: The college season being evaluated (s).
    provenance: derived (roster.season, player_stats.season)
  - name: has_stat_line
    type: logical
    description: 1 if the player has a stat line in `player_stats` that season, else 0 (on a roster without one).
    provenance: derived (player_stats)
  - name: team
    type: string
    description: The row's college team, the stat-line team when there is one, else the roster team.
    provenance: derived (player_stats.team, roster.team)
  - name: tier
    type: int32
    description: >
      Season-aware conference tier of the row's team (3 Power, 2 Group of 5,
      1 FCS and below; decision 0003), from `team_season`: the (season,
      conference) lookup, else the conference of the team's nearest season
      with games (no games ingested that season), else tier 1 for a
      conference outside the lookup (Division II/III). Never NA; the contract
      fails on a missing tier.
    provenance: derived (team_season.tier)
  - name: tier_label
    type: string
    description: Reader-facing label of `tier`.
    provenance: derived (team_season.tier_label)
  - name: first_roster_season
    type: int32
    description: >
      The player's first season on any college roster in the data. NA only for
      the few stat-line players never on a roster. Earlier college years may be
      missing (transfers from programs the data does not cover, or careers that
      began before 2010).
    provenance: derived (career_summary.first_season)
  - name: is_first_roster_season
    type: logical
    description: 1 on the row of the player's first roster season, else 0. Never NA. Use it to check how much a result rests on players' first seasons in the data; flagged rows are kept.
    provenance: derived
  - name: hs_grad_year
    type: int32
    description: >
      High-school graduation year (h), the time origin of the eligibility clock.
      Recruiting `hs_class` via the name-guarded link when available; otherwise
      imputed as the first observed college season (the earlier of the first
      roster season and the first stat season), a direct enrollee's class
      (decision 0051), with `hs_year_imputed = 1`. The imputation dates the
      clock too late for players whose earlier college years the data does
      not cover (JUCO, transfers from uncovered programs, prep years); use
      the flag to filter or sensitivity-check.
    provenance: derived (recruiting.hs_class, else imputed from career_summary.first_season)
  - name: hs_year_imputed
    type: logical
    description: 1 if `hs_grad_year` was imputed from the first observed college season, else 0.
    provenance: derived
  - name: last_season
    type: int32
    description: Last season the player is observed on a roster (may extend past the last stat season; a no-stat final year still means no further college season).
    provenance: derived (career_summary.last_season)
  - name: draft_year
    type: int32
    description: >
      The draft this row's outcome is about: the draft after the season
      (d = s + 1), except on the player's latest row before his NFL entry when
      the entry comes later (a season off every roster, or a roster that skips
      seasons), where it is that entry's draft. The eligibility clock is
      computed against it.
    provenance: derived
  - name: years_since_hs
    type: int32
    description: The eligibility clock, d - h; increases by 1 each row.
    provenance: derived
  - name: min_years_since_hs
    type: int32
    description: Required gap between HS graduation and the draft (3 for 2010-2026), stored as a column so it can vary by draft year later.
    provenance: derived (constant parameter)
  - name: draft_eligible
    type: logical
    description: TRUE when years_since_hs >= min_years_since_hs, the risk-set indicator. Only TRUE rows form the at-risk population.
    provenance: derived
  - name: eligible_season_index
    type: int32
    description: 1 in the first eligible season, 2 in the second, and so on; NA before eligibility. The discrete-time baseline hazard index.
    provenance: derived
  - name: gsis_id
    type: string
    description: nflverse id for the resolved NFL link (draft slot for drafted players, name guard for UDFAs); NA when no NFL record. Audit/provenance only.
    provenance: derived (picks_nfl, nfl_rosters)
  - name: outcome_observed_d
    type: logical
    description: 1 if the year this row's outcome is decided (draft_year, or the later NFL entry year on a player's last stat row) is <= the last draft year with complete data, else 0. Rows with 0 get NA outcomes, not 0 (administrative right-censoring).
    provenance: derived (last_complete_nfl_draft())
  - name: outcome_drafted_d
    type: logical
    description: >
      1 if selected in draft d, else 0 (NA when censored). On a player's last
      stat row, a pick in a later draft also counts (his final college
      seasons had no stat line, e.g. a lineman or an injured senior), so the
      event lands on the last row the population observes. The pick joins by
      athlete id, or, when the pick's CFBD id is outside the population, by
      normalized name + college team with exactly one candidate on each side.
      The event indicator for a draft-only analysis.
    provenance: derived (picks via athlete id, else name + school)
  - name: outcome_draft_round_d
    type: int32
    description: Round selected (1-7), NA if undrafted or censored. For ordinal models.
    provenance: derived (picks)
  - name: outcome_draft_pick_d
    type: int32
    description: Overall pick number, NA if undrafted or censored. For continuous draft-capital models.
    provenance: derived (picks)
  - name: outcome_draft_round_group_d
    type: string
    description: Ordered category r1 / r2_3 / r4_7 / undrafted (NA when censored). Can define competing events or strata.
    provenance: derived (outcome_draft_round_d)
  - name: outcome_signed_udfa_d
    type: logical
    description: >
      1 if not drafted but first on an NFL roster in the season after draft d
      (or, on a player's last stat row, any later season in the entry window),
      else 0 (NA when censored). The name guard never links a gsis_id that
      belongs to a draft pick (CFBD or nflverse), never links a player who
      holds a pick, and requires the first NFL season to follow the player's
      last college stat season (an earlier one is a namesake). Mutually
      exclusive with `outcome_drafted_d`.
    provenance: derived (nfl_rosters via name guard)
  - name: outcome_nfl_entry_d
    type: logical
    description: 1 if drafted OR signed_udfa, else 0 (NA when censored). The broadest event indicator and the best default for sparse positive cases.
    provenance: derived (outcome_drafted_d | outcome_signed_udfa_d)
  - name: outcome_nfl_entry_type_d
    type: string
    description: "Competing-risks event type: drafted_r1 / drafted_r2_3 / drafted_r4_7 / udfa / none (NA when censored)."
    provenance: derived
  - name: outcome_nfl_entry_by_d_plus_k
    type: logical
    description: 1 if the player entered the NFL (either route) in any draft class from d through d + k - 1 (k = 1 by default). A fixed-horizon binary outcome.
    provenance: derived
  - name: outcome_made_roster_entry_year
    type: logical
    description: 1 if on an NFL roster in the entry year, else 0; NA when the player did not enter (or is censored). A second-stage event.
    provenance: derived (nfl_rosters via gsis_id)
  - name: outcome_rookie_games_entry_year
    type: int32
    description: Games played in the entry season, 0 if none; NA when the player did not enter (or is censored). A numeric outcome. Partial for the latest draft class until its first NFL season ends.
    provenance: derived (nfl_player_stats.games via gsis_id)
  - name: outcome_source
    type: string
    description: "Where the label came from: draft_table / roster_table / none. Audit only."
    provenance: derived
  - name: years_to_nfl_entry
    type: int32
    description: "Seasons from the HS time origin to NFL entry (entry draft year - h); for players who never entered, the time to last observation. The event time for time-to-event models. Contract: positive."
    provenance: derived
  - name: nfl_entry_event
    type: logical
    description: 1 if entry occurred, 0 if the player is still at risk (censored). Pairs with `years_to_nfl_entry` for a Cox-style analysis.
    provenance: derived
  - name: status_end_of_season
    type: string
    description: >
      Competing-risks status: drafted / signed_udfa / exhausted_undrafted /
      left_data / continuing / censored. `continuing` and `censored` are
      right-censored; `left_data` (absent from the next season but not at the
      roster backbone's last observed season) is informative censoring
      (transfers, injuries, early departures) to be treated deliberately.
    provenance: derived
