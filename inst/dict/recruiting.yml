dataset: recruiting
source: CFBD /recruiting/players (per class year, 2010–2026)
grain: one recruited athlete (deduped from the per-class feed)
key: playerId (string, from athleteId)
description: >
  High-school recruiting ratings (industry `stars` 2–5, composite `rating`
  ~0.74–1.0, national `ranking`) keyed by athlete id. clean_recruiting drops
  recruits with no athleteId (~40% of the feed) and dedupes to one row per
  athlete (highest rating, then stars, then most recent class). The recruiting
  athleteId is NOT a reliable member of the shared athlete-id namespace: it
  collides across different people (e.g. Cam Ward's id maps to Xavier Ward), so
  any join must be name-guarded via link_recruiting().
columns:
  - name: playerId
    type: string
    description: Athlete id (from recruiting `athleteId`) coerced to string.
    provenance: derived (clean_recruiting)
  - name: recruit_name
    type: string
    description: Recruit name as reported by the feed; used for the link-time name guard. May disagree with the athlete-id namespace name on a collision.
    provenance: raw (name)
  - name: hs_class
    type: int32
    description: High-school recruiting class year.
    provenance: raw (year)
  - name: stars
    type: int32
    description: Industry star rating (2–5); NA where unrated.
    provenance: raw
  - name: rating
    type: double
    description: Composite 0–1 rating (most rated players ~0.7–1.0); NA where unrated. Contract bounds it to [0, 1].
    provenance: raw
  - name: national_rank
    type: int32
    description: National recruit ranking; NA where unranked.
    provenance: raw (ranking)
  - name: recruit_position
    type: string
    description: Recruiting position.
    provenance: raw (position)
  - name: committed_to
    type: string
    description: School the recruit committed to per the feed. May reflect a later commitment, not the first college.
    provenance: raw (committedTo)
