dataset: career_end
source: derived in-pipeline (career_end_status(career, outcomes, picks_nfl))
grain: one player's college career (one row per career_summary() row)
key: playerId (string)
description: >
  How each college career ended. One row per career from `career_summary`, with
  exactly one category in `career_end`. The early-stop category is a PROXY: a
  career that stops while NCAA eligibility remains, on a single school, with no
  NFL entry, is labelled `early_stop`. It is injury-shaped, not an injury: CFBD
  has no injury feed, so absence alone cannot separate an injury from a walk-on
  quitting, an academic exit, or a transfer outside the roster data. Use
  `early_stop_proxy`, never the word "injury", in summaries. Categories apply in
  order (first match wins): right_censored, drafted, signed_udfa,
  not_in_model_population, eligibility_exhausted, eligibility_unknown,
  transferred_then_stopped, early_stop. A derived table: bundled into the DuckDB
  asset, not published as parquet. Careers whose last roster season is the most
  recent in the data, or whose next NFL draft is past the last complete draft,
  are `right_censored`, never early stops. Eligibility clock: seasons from first
  to last roster season, minus 2020 (the COVID-19 waiver), against 5. Contract:
  contract_career_end().
columns:
  - name: playerId
    type: string
    description: Athlete id (the shared college-athlete namespace). Ids with a roster span over 7 seasons are excluded as CFBD id reuse.
    provenance: derived (career_summary.playerId)
  - name: first_season
    type: int32
    description: First season the player appears on a roster. Left-censored at the first roster season in the data (2010).
    provenance: derived (career_summary.first_season)
  - name: last_season
    type: int32
    description: Last season the player appears on a roster.
    provenance: derived (career_summary.last_season)
  - name: seasons
    type: int32
    description: Distinct roster seasons observed for the player.
    provenance: derived (career_summary.seasons)
  - name: transfers
    type: int32
    description: Team changes across the career (distinct teams minus one). A career with transfers > 0 cannot be an early_stop.
    provenance: derived (career_summary.transfers)
  - name: gap_seasons
    type: int32
    description: Seasons absent between first and last roster season.
    provenance: derived (career_summary.gap_seasons)
  - name: clock_seasons_used
    type: int32
    description: "Eligibility seasons used: calendar seasons from first to last roster season, minus the 2020 season (not counted under the NCAA COVID-19 waiver). Can be 0 for a one-season 2020 career."
    provenance: derived (first_season, last_season)
  - name: eligibility_remaining
    type: int32
    description: eligibility_seasons (5) minus clock_seasons_used. Above 0 means eligibility remained at the last roster season. Not observable exactly (medical hardship and redshirt rules are not in the data).
    provenance: derived
  - name: clock_start_observed
    type: logical
    description: TRUE when first_season is after the first roster season in the data, so the clock start is observed. FALSE means the career may have started earlier (left-censored).
    provenance: derived
  - name: in_model_population
    type: logical
    description: TRUE when the player has at least one row in the outcomes table (a stat line, reused ids excluded). FALSE careers have no UDFA label here.
    provenance: derived (outcomes.playerId)
  - name: drafted
    type: logical
    description: TRUE when a CFBD pick is bridged to the player in a draft after first_season. Covers every career, stat line or not.
    provenance: derived (picks via link_nfl_draft)
  - name: signed_udfa
    type: logical
    description: TRUE when the player was not drafted but matched to an NFL roster by the name guard. Only in-population players can be TRUE.
    provenance: derived (outcomes.outcome_signed_udfa_d)
  - name: right_censored
    type: logical
    description: TRUE when the career is not yet observed to end (last roster season is the most recent in the data, or the following NFL draft is past the last complete draft). Never an early stop.
    provenance: derived
  - name: career_end
    type: string
    description: >
      Mutually exclusive, exhaustive category. right_censored / drafted /
      signed_udfa / not_in_model_population (no stat line and not drafted) /
      eligibility_exhausted / eligibility_unknown (eligibility remains, clock
      start left-censored) / transferred_then_stopped (eligibility remains, more
      than one school) / early_stop (the proxy).
    provenance: derived
  - name: early_stop_proxy
    type: logical
    description: >
      PROXY, not an injury label. TRUE only for career_end == early_stop: single
      school, eligibility left, not censored, no drafted or UDFA NFL entry, in
      the stat-line population.
    provenance: derived
