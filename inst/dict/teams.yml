dataset: teams
source: CFBD /teams (all divisions)
grain: one row per team (program)
key: team (string, from school)
description: >
  Team dimension for display: logos, colors, mascot, abbreviation,
  conference and home-stadium location (city, state, latitude/longitude). Joined by school NAME (`team`), the same namespace as
  `player_stats.team` and the coach join. Display metadata only, kept off the
  model path. Cleaning dedupes duplicate school names to one row per school and
  extracts light/dark logo URLs from the `logos` array; a few small programs
  carry no logo (NA).
columns:
  - name: team
    type: string
    description: Team / school name (join key).
    provenance: raw (school)
  - name: team_id
    type: int32
    description: CFBD numeric team id.
    provenance: raw (id)
  - name: mascot
    type: string
    description: Team mascot.
    provenance: raw
  - name: abbreviation
    type: string
    description: Short team abbreviation.
    provenance: raw
  - name: conference
    type: string
    description: Current conference (team-level, not season-aware).
    provenance: raw
  - name: classification
    type: string
    description: Division (fbs, fcs, ii, iii, ...); used to pick the real row when a school name is duplicated.
    provenance: raw
  - name: color
    type: string
    description: Primary team color (hex).
    provenance: raw
  - name: alt_color
    type: string
    description: Alternate team color (hex).
    provenance: raw (alternateColor)
  - name: logo_light
    type: string
    description: Light-background logo URL; NA for a few small programs.
    provenance: derived (clean_teams)
  - name: logo_dark
    type: string
    description: Dark-background logo URL; NA when unavailable.
    provenance: derived (clean_teams)
  - name: venue
    type: string
    description: Home stadium name; NA when CFBD has no home venue (most lower-division and phantom rows).
    provenance: raw (location.name)
  - name: city
    type: string
    description: Home stadium city.
    provenance: raw (location.city)
  - name: state
    type: string
    description: Home stadium state (two-letter code).
    provenance: raw (location.state)
  - name: latitude
    type: double
    description: Home stadium latitude (decimal degrees); places the program on a map. Present for every FBS program.
    provenance: raw (location.latitude)
  - name: longitude
    type: double
    description: Home stadium longitude (decimal degrees, negative west).
    provenance: raw (location.longitude)
