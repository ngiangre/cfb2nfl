# Glossary of the terms cards use (feature F25). A card lists the keys it
# relies on in `terms:` and card_footer() prints their definitions, so every
# card defines its own words without repeating them in prose. Keys are
# lowercase-hyphenated; labels and definitions are reader-facing.
player-season:
  label: Player-season
  definition: "One season a player spends on a college roster, with or without a recorded stat line."
eligible-season:
  label: Eligible season
  definition: "A player-season after which the player could be drafted: the next draft comes at least three years after his high-school graduation."
eligible-season-number:
  label: Eligible season number
  definition: "Counts a player's eligible seasons from one: 1 is the first season he could be drafted after."
known-outcome:
  label: Eligible seasons with a known outcome
  definition: "Eligible seasons whose next draft has already happened. Later draft classes are left out rather than counted as failures."
draft-class:
  label: Draft class
  definition: "The NFL draft held the spring after an eligible season; a season's class is that draft, so one player's seasons fall in several classes."
drafted:
  label: Drafted
  definition: "Selected in the NFL draft held the spring after the season, reported by round: round 1, rounds 2 to 3, rounds 4 to 7."
signed-undrafted:
  label: Signed as an undrafted free agent
  definition: "Not selected in that draft, but on an NFL roster within the entry window afterward (matched by a guarded name lookup)."
nfl-entry:
  label: NFL entry
  definition: "Drafted or signed as an undrafted free agent."
still-playing:
  label: Still playing next season
  definition: "Back on a college roster the next season; the season is one more turn of the eligibility clock, not an outcome."
exhausted-undrafted:
  label: Exhausted eligibility undrafted
  definition: "The player's last observed college season, with no draft selection and no NFL roster appearance after it."
left-the-data:
  label: Gone the next season, reason unknown
  definition: "Absent the next season although his record says a next season should exist (a transfer with sitting time, an injury retirement, or an unobserved departure); the outcome is unknown."
per-season-chance:
  label: Per-season chance
  definition: "Among players still unentered and still playing at a given eligible season, the share drafted or signed after the very next draft."
confidence-interval:
  label: 95% confidence interval
  definition: "The range the true rate plausibly occupies given how many seasons it rests on (Wilson's method)."
rookie-games:
  label: Rookie games
  definition: "Regular-season NFL games played in the season the player entered the league. Draft classes whose rookie season is still being played are left out."
position-group:
  label: Position group
  definition: "The roster position listed for the player that season, grouped by role: quarterback (QB); running back (RB, FB); receiver (WR); tight end (TE); offensive line (T, G, C, OL, OT); defensive line (DL, DE, DT, NT, EDGE); linebacker (LB, ILB, OLB); defensive back (DB, S, CB); special teams (PK, P, LS, PR, KR). Seasons with a placeholder, the catch-all athlete code (ATH) or no roster row are left out as position not recorded."
overall-pick:
  label: Overall pick
  definition: "A player's place in the whole draft order, counting every round: pick 1 is the first selection of round 1."
career-eligible-season:
  label: Eligible season (career endings)
  definition: "A season on a college roster after which the next NFL draft could select the player, at least three years after high school. Season 1 is his first such season: for a player who enrolled straight from high school, his third college season, redshirt or not. His high-school year comes from his recruiting record or, when none can be matched, is estimated as the year of his first college season."
career-drafted:
  label: Drafted (career endings)
  definition: "Selected in the NFL draft after that season, or after a later season off every roster."
career-signed-undrafted:
  label: Signed undrafted
  definition: "Not drafted, and first on an NFL roster the following season."
eligibility-ended:
  label: Eligibility ended, undrafted
  definition: "His last season on a college roster, with no NFL outcome, for any reason: eligibility used up, leaving early undrafted and unsigned, quitting or a medical retirement, a transfer to a program the data does not cover, or an NFL signing more than a season later."
career-still-playing:
  label: Still playing (censored)
  definition: "Eligible, his career not yet ended, and on a roster in the season under way, so his next draft has not happened. The curves count him through his last completed eligible season."
awaiting-first-draft:
  label: Awaiting first draft
  definition: "Still playing with no eligible season completed yet. He is in no season's at-risk count yet; he and the other players still playing are the players a forecast would predict."
study-population:
  label: Study population
  definition: "Every draft-eligible player whose position is recorded; every curve, rate and count on the career-endings cards describes them."
ruled-out:
  label: Ruled out
  definition: "Drafted or signed before his first eligible season by the clock, which the NFL's three-year rule does not allow, so the data has missed part of his college career. Left out of the study population."
missed-season:
  label: Missed season
  definition: "A season off every college roster in the data (a medical retirement, a transfer to a program the data does not cover) followed by a return; not an ending, and it does not advance the clock."
first-eligible-position:
  label: Position group (career endings)
  definition: "His roster position in his first eligible season, in the position groups of the drafted-rate cards."
cumulative-percent:
  label: Cumulative percent
  definition: "Of the group's eligible players, the percent whose career has ended a given way by a given season. Each season's chance applies only to players whose careers have not yet ended, and a player still playing counts only through the seasons he has played (the Aalen-Johansen estimate), so the endings plus the percent still playing add to 100%."
at-risk:
  label: At risk
  definition: "Players still playing going into a season, the denominator for that season's chance."
matched-recruiting-record:
  label: Matched recruiting record
  definition: "A high-school recruiting record safely matched to the player by name. Without one his high-school year is estimated, which is not the same as being unrecruited."
seasons-and-players:
  label: Seasons and players
  definition: "Some cards count eligible seasons, others players. A player has several eligible seasons but his NFL entry falls on one of them, so drafted and undrafted totals nearly match; the career-ending cards also leave out players ruled out or with no recorded position, so their totals run slightly lower."

# ---- batch movement ----
stat-line-season:
  label: Player-season with a stat line
  definition: "One season on a college roster in which the player has a recorded stat line. Seasons without one are not counted, so a move between two such seasons is the only kind of transfer the transfer cards can see."
transfer-event:
  label: Transfer
  definition: "A season at a school different from the player's previous observed season. A gap season between the two, such as a redshirt year, does not hide the move."
competition-tier:
  label: Competition tier
  definition: "The conference tier of a school in that season: Power for the Power conferences, Group of Five for the other Football Bowl Subdivision conferences, and FCS and below for the Football Championship Subdivision and lower divisions. Conferences are placed season by season, so realignment is followed."
transfer-direction:
  label: Direction of a transfer
  definition: "Whether the new school sits in a higher tier, the same tier, or a lower tier than the old one. A move between two programs in the same tier is 'same tier' even when one program is far stronger."
harmonized-position-group:
  label: Position group (across sources)
  definition: "One of eleven shared groups that map the position codes of the recruiting, college roster and NFL draft records onto each other. Athlete means the player is listed only as ATH, with no group to carry; Position not recorded covers blank or unknown codes."
linked-recruit:
  label: Linked recruit
  definition: "A high-school recruiting record joined to a college athlete by name, or, when the college name is not on file, by the school he committed to and his class year. A link can join two different people, so the linking rule is checked by hand against a sample."
recruiting-profile:
  label: Recruiting profile
  definition: "The star grade (two to five), the composite rating and the national rank that a recruiting service gave a high-school prospect for his class."
roster-season:
  label: Roster season
  definition: "A season in which the player appears on a college or NFL team's roster, whatever his role. It shows presence on a roster, not playing time or statistics."
nfl-draft-link:
  label: NFL draft record
  definition: "The nflverse draft pick matched to a college athlete by draft slot and checked by name. A player with no draft record went undrafted, whether or not an NFL club later signed him."
# ---- coaches-combine batch (F25, #147) ----
last-school-rule:
  label: Last-school rule
  definition: "Credits a draftee to the head coach of his final college season, the program he played for last."
every-season-rule:
  label: Every-season rule
  definition: "Credits a draftee to every head coach he played under, so a player who changed programs counts under each."
coach-set:
  label: Coach set
  definition: "The head coaches a draftee is credited to under one rule; two rules name the same coaches when their sets match exactly."
draftee-coach-pair:
  label: Draftee and coach pair
  definition: "One draftee linked to one head coach; a draftee with two coaches under a rule gives two pairs."
head-coach:
  label: Head coach
  definition: "The head coach of a program in a season, from the coaches table; assistant coaches and coordinators are not included."
head-coach-tenure:
  label: Head-coach tenure
  definition: "How many seasons a head coach held the job in the window, counted from the coaches table; a season counts once however many games it had."
# ---- combine batch (F25, #147) ----
combine:
  label: NFL Scouting Combine
  definition: "A week of measurements and drills each February before the spring draft. The 2021 combine was cancelled, so that year's records come from campus workouts."
invitee:
  label: Combine invitee
  definition: "A player on the combine's list for a year, whether or not he took part in every drill."
recorded-measurable:
  label: Recorded measurable
  definition: "A combine measurable with a value for the invitee. A missing value usually means he chose not to do the drill."
middle-half:
  label: Middle half
  definition: "The range from the 25th to the 75th percentile: half of a position group's invitees fall inside it."
invitation-rate:
  label: Invitation rate
  definition: "Invitees among a draft year's draft-eligible seasons, the share of eligible players the combine invites."
pro-day-year:
  label: 2021 pro-day year
  definition: "The 2021 combine was cancelled, so that year's records are campus pro-day workouts, not a combine. The cards shade it, and its invitee counts are not comparable."
draft-eligible-population:
  label: Draft-eligible population
  definition: "Invitees linked to a college player id who were draft-eligible in their draft year, so their college seasons and draft result are on record."
linked-outside-population:
  label: Linked, outside the population
  definition: "Invitees linked to a college player id who were not draft-eligible in their draft year, such as a player whose eligible seasons are not in the roster data."
no-college-id:
  label: No college id
  definition: "Invitees the link could not match to a college player id, mostly offensive linemen, who rarely have a stat line."
# ---- batch programs ----
division:
  label: Division
  definition: "The NCAA level a school plays at: FBS (the top level), FCS (the level below it), Division II and Division III. Division II, Division III and schools with no recorded division are grouped as Division II and below."
conference:
  label: Conference
  definition: "A league of schools that schedule each other and share a championship, such as the SEC or the Big Sky. A few FBS schools are independents and belong to no football conference."
realignment:
  label: Conference change
  definition: "An FBS school playing in a different conference, or as an independent, than in its previous FBS season. The Pac-10's 2011 rename to the Pac-12 is not counted."
tier:
  label: Tier
  definition: "A three-level grouping of conferences by competitive level, set season by season, so a school that changes conference can change tier."
power-tier:
  label: Power
  definition: "The top tier: the SEC, Big Ten, ACC and Big 12; the Pac-12 through 2023; the Big East through 2012; and Notre Dame, which plays as an independent."
group-of-5-tier:
  label: Group of 5
  definition: "The rest of FBS: the American Athletic from 2013, Conference USA, Mid-American, Mountain West, Sun Belt, Western Athletic through 2012, the two-school Pac-12 from 2024, and the independents other than Notre Dame."
fcs-and-below:
  label: FCS and below
  definition: "Every school outside FBS: the FCS, Division II and Division III."
team-season:
  label: Team-season
  definition: "One school in one season."
stat-line:
  label: Stat line
  definition: "At least one recorded statistic (a carry, catch, tackle or kick) for a player in a season."
credited-pick:
  label: Credited pick
  definition: "A draft pick traced to the last college roster the player was on before the draft. A pick with no matching roster is not credited to any school."
draft-day-school:
  label: Draft-day school
  definition: "The college the NFL draft lists for a player."
