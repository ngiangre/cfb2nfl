# Migration ledger (feature F25): where every section of each dated post
# went. `fate` is card (the section's figures became the card), merged (its
# table or definitions now live on the card named, or in the glossary,
# inst/cards/terms.yml) or dropped (with the reason). A `card:` listed here
# is published: check_cards_style() fails if it is renamed or deleted
# without an `aliases:` entry on its replacement.

