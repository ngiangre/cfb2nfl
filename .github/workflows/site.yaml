name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires GitHub Pages to be enabled for the repo (Settings > Pages > "GitHub
# Actions"). Data is not in git; it is pulled from the data-latest release
# (published by data-current.yaml, which also dispatches this workflow), then
# the pipeline runs in track mode, with no CFBD key and no API calls, so the
# audit/DAG pages have targets to read.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Vignettes read the pipeline from the project root under altdoc's build.
      CFB2NFL_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs the dependencies in DESCRIPTION but never cfb2nfl itself
      # (decision 0042): vignettes load it from the checkout via pkgload, and
      # man-page examples are \dontrun{} so altdoc never executes them.
      # piggyback pulls data.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::altdoc
            any::piggyback
            any::pkgload
            any::duckdb

      # data/ is gitignored, so it is absent on a fresh checkout; pb_download
      # will not create the dest dir and errors ("Failed to open file ...").
      - name: Download data assets
        run: |
          Rscript -e 'dir.create("data", showWarnings = FALSE); piggyback::pb_download(repo = Sys.getenv("GITHUB_REPOSITORY"), tag = "data-latest", dest = "data")'
          Rscript -e 'pkgload::load_all(quiet = TRUE); record_release_date("data", repo = Sys.getenv("GITHUB_REPOSITORY"))'

      # Card thumbnails are committed and rendered locally (feature F25); list
      # any drawn from an older data release than this one. A note, not a
      # failure: re-render those cards locally to refresh them.
      - name: Report card thumbnails behind the data release
        run: |
          Rscript -e 'pkgload::load_all(quiet = TRUE); bad <- check_cards_style(root = ".", release = data_release_date("data")); old <- bad[bad$severity == "note", ]; if (nrow(old)) cat(sprintf("::notice file=vignettes/%s::%s", old$file, old$message), sep = "\n")'

      - name: Run pipeline
        run: Rscript -e 'targets::tar_make()'

      # Pages whose code reads OTHER files at knit time (reference.qmd reads
      # function metadata; pipeline.qmd reads the targets store built by the
      # step above) have that dependency
      # hidden from Quarto's per-document cache check, so their freeze entries
      # go stale whenever those inputs change. Bust them so these pages always
      # re-execute.
      - name: Bust freeze cache for pages with hidden inputs
        run: rm -rf _quarto/_freeze/vignettes/reference _quarto/_freeze/vignettes/pipeline

      # freeze = TRUE reuses the committed _quarto/_freeze/ cache so CI does not
      # re-execute vignette code; renders are faster and deterministic (dec 0007).
      - name: Render site (altdoc -> docs/)
        run: Rscript -e 'altdoc::render_docs(verbose = TRUE, freeze = TRUE)'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # A separate job: deploy-pages looks the artifact up through the API, and
  # in the same job it ran before the fresh upload was listed ("No artifacts
  # named github-pages", 2026-11-24, three runs). A job boundary waits for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          # Safety margin: Pages processes the artifact slowly (default 10 min).
          timeout: 1800000
