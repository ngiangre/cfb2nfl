name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires GitHub Pages to be enabled for the repo (Settings > Pages > "GitHub
# Actions"). Data is not in git; it is pulled from a release asset published by
# the data-refresh workflow, then the pipeline runs so the audit/DAG pages have
# targets to read.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Vignettes read the pipeline from the project root under altdoc's build.
      CFB2NFL_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # local::. installs the cfb2nfl package itself (vignettes call
      # library(cfb2nfl)); altdoc builds the site, piggyback pulls the data.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::altdoc
            any::piggyback
            any::duckdb

      # data/ is gitignored, so it is absent on a fresh checkout; pb_download
      # will not create the dest dir and errors ("Failed to open file ...").
      - name: Download data assets
        run: |
          Rscript -e 'dir.create("data", showWarnings = FALSE); piggyback::pb_download(repo = Sys.getenv("GITHUB_REPOSITORY"), tag = "data-latest", dest = "data")'

      - name: Run pipeline
        run: Rscript -e 'targets::tar_make()'

      # Pages whose code reads OTHER files at knit time (blog.qmd reads the
      # posts' YAML titles; reference.qmd reads function metadata) have that
      # dependency hidden from Quarto's per-document cache check, so their
      # freeze entries go stale whenever those inputs change. Bust them so the
      # index pages always re-execute.
      - name: Bust freeze cache for index pages
        run: rm -rf _quarto/_freeze/vignettes/blog _quarto/_freeze/vignettes/reference

      # freeze = TRUE reuses the committed _quarto/_freeze/ cache so CI does not
      # re-execute vignette code; renders are faster and deterministic (dec 0007).
      - name: Render site (altdoc -> docs/)
        run: Rscript -e 'altdoc::render_docs(freeze = TRUE)'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
