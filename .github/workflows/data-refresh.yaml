name: data-refresh

# FULL refresh: re-pull every season (~780 CFBD calls) and publish it as the
# data-latest release asset, keeping large data out of git history. On demand
# only (decision 0034): the scheduled path is data-current.yaml, which re-pulls
# just the current season. Use this when a schema change needs every season
# re-cleaned; CFBD often throttles shared runner IPs on a pull this size, so
# data-raw/refresh.R run locally is the fallback. Requires CFBD_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Refresh mode: the pipeline ingests fresh and writes every asset (dec 0017).
      CFB2NFL_REFRESH: "true"
      # Full window: every season is rebuilt, not spliced (decision 0034).
      CFB2NFL_REFRESH_SEASONS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # DESCRIPTION dependencies only; tar_make() sources R/ itself and never
      # needs cfb2nfl installed (decision 0042).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::piggyback
            any::duckdb

      # Carry the schema history across refreshes: CI checkouts start empty,
      # so the prior history must come from the last published release asset.
      - name: Download prior schema history
        run: |
          Rscript -e '
            try(
              piggyback::pb_download(
                "audit_history.csv",
                repo = Sys.getenv("GITHUB_REPOSITORY"),
                tag = "data-latest",
                dest = "data"
              ),
              silent = TRUE
            )
          '

      # One pass: ingest (incl. conference_tiers) -> process -> write every raw
      # parquet and the DuckDB bundle, all as targets (decision 0017).
      - name: Ingest, process, and bundle all data
        run: Rscript -e 'targets::tar_make()'

      # pb_upload requires the release to already exist, so create the
      # data-latest release on first run before uploading the parquet assets.
      - name: Publish data as release asset
        run: |
          Rscript -e '
            repo <- Sys.getenv("GITHUB_REPOSITORY")
            tags <- tryCatch(piggyback::pb_releases(repo)$tag_name, error = function(e) character())
            if (!"data-latest" %in% tags) piggyback::pb_release_create(repo, tag = "data-latest")
            # Publish the parquet tables and the bundled DuckDB file (decision 0016).
            piggyback::pb_upload(list.files("data", pattern = "\\.(parquet|duckdb)$", full.names = TRUE), repo = repo, tag = "data-latest", overwrite = TRUE)
            # Append-only history of per-step schema hashes for drift detection.
            if (file.exists("data/audit_history.csv")) {
              piggyback::pb_upload("data/audit_history.csv", repo = repo, tag = "data-latest", overwrite = TRUE)
            }
          '
